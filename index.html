<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFF0EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111118" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sổ Tòa Nhà">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Sổ Tòa Nhà</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap&subset=vietnamese" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{
  --paper:#EFF0EC; --surface:#FFFFFF; --surface-2:#F6F7F3; --ink:#191B22; --ink-2:#4F5462; --ink-3:#8B909B;
  --line:#E1E3DC; --line-2:#ECEDE8;
  --night:#1D1B2C; --night-2:#2A2740; --night-3:#3A3656; --night-ink:#EDEAF8; --night-ink-2:#A7A2C3;
  --glow:#FFC24B; --glow-2:#F5A623; --glow-soft:rgba(255,194,75,.16);
  --elec:#E09B00; --water:#1F74D6; --lavie:#0FA592;
  --ok:#2A9D68; --ok-soft:rgba(42,157,104,.12); --warn:#D98200; --warn-soft:rgba(217,130,0,.13); --bad:#D4433A; --bad-soft:rgba(212,67,58,.11);
  --c-repair:#C8643B; --c-salary:#5B4BDB; --c-outside:#1592A8; --c-other:#B08A2E;
  --radius:20px; --radius-s:12px;
  --shadow:0 1px 2px rgba(20,20,40,.04),0 10px 30px -16px rgba(20,20,40,.18);
  --f-display:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif;
  --f-body:'Be Vietnam Pro',ui-sans-serif,system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#111118; --surface:#1A1A24; --surface-2:#21212D; --ink:#ECEDF2; --ink-2:#B3B6C2; --ink-3:#7D8090;
  --line:#2C2C3A; --line-2:#252531; --night:#17152A; --night-2:#24213A; --night-3:#35314F;
  --ok-soft:rgba(42,157,104,.2); --warn-soft:rgba(217,130,0,.2); --bad-soft:rgba(212,67,58,.2); --c-salary:#7D6EF2;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -18px rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111118; --surface:#1A1A24; --surface-2:#21212D; --ink:#ECEDF2; --ink-2:#B3B6C2; --ink-3:#7D8090;
  --line:#2C2C3A; --line-2:#252531; --night:#17152A; --night-2:#24213A; --night-3:#35314F;
  --ok-soft:rgba(42,157,104,.2); --warn-soft:rgba(217,130,0,.2); --bad-soft:rgba(212,67,58,.2); --c-salary:#7D6EF2;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -18px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button,a,input,select,label{touch-action:manipulation}
body.lock{overflow:hidden}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--glow-2);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:-.02em}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:var(--night);color:var(--night-ink);display:flex;flex-direction:column;padding:24px 16px 18px;overflow:hidden}
.side::before{content:"";position:absolute;inset:auto -40% -30% -40%;height:55%;background:radial-gradient(closest-side,rgba(255,194,75,.12),transparent);pointer-events:none}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 26px}
.brand-mark{width:40px;height:40px;border-radius:12px;background:var(--night-2);display:grid;place-items:center}
.brand b{display:block;font-family:var(--f-display);font-size:19px;letter-spacing:-.02em;line-height:1.1}
.brand span{font-size:12.5px;color:var(--night-ink-2)}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--night-ink-2);font-weight:500;text-align:left;transition:background .15s,color .15s}
.nav button[aria-current="page"]{background:var(--night-2);color:#fff}
.nav button[aria-current="page"] svg{color:var(--glow)}
.nav .badge{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--bad);color:#fff;border-radius:99px;padding:1px 7px}
.side-foot{margin-top:auto;position:relative}
.sync-card{background:var(--night-2);border-radius:16px;padding:14px}
.sync-card .row{display:flex;align-items:center;gap:8px;font-size:13px}
.sync-card small{display:block;color:var(--night-ink-2);font-size:12px;margin:4px 0 10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.ok{background:#3BD28A;box-shadow:0 0 0 3px rgba(59,210,138,.18)}
.dot.dirty{background:var(--glow);box-shadow:0 0 0 3px rgba(255,194,75,.2)}
.dot.busy{background:var(--glow);animation:pulse 1s infinite}
.dot.off{background:#8C88A8}
.dot.err{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.btn-glow{width:100%;background:var(--glow);color:#2B1D00;font-weight:700;border-radius:11px;padding:9px 12px;font-size:13.5px}
.btn-glow:disabled{opacity:.45;cursor:default}

.main{min-width:0;padding:0 36px 56px}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:flex-end;gap:16px;padding:26px 0 18px;background:linear-gradient(var(--paper) 78%,rgba(0,0,0,0))}
.topbar h1{font-size:34px;font-weight:800;line-height:1}
.topbar .sub{color:var(--ink-3);font-size:13.5px;margin-top:6px}
.tb-title{flex:1;min-width:0}
.tb-mobile{display:none}
.month-switch{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px;box-shadow:var(--shadow)}
.month-switch button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.month-switch .ml{padding:0 10px;font-weight:600;font-size:14px;min-width:118px;text-align:center}
.month-switch .ml small{display:block;font-weight:500;font-size:11px;color:var(--ink-3);line-height:1.2}
.tabbar{display:none}

/* ---------- Generic ---------- */
.grid{display:grid;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.card-h h2{font-size:19px;font-weight:700}
.card-h .grow{flex:1}
.card-h .hint{font-size:12.5px;color:var(--ink-3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;padding:9px 14px;font-weight:600;font-size:14px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--night);color:#fff;border-color:var(--night)}
.btn.glow{background:var(--glow);color:#2B1D00;border-color:var(--glow)}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.night{background:var(--night);color:var(--night-ink)}
.empty{padding:28px 10px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;margin-bottom:4px}

/* Ledger strip (KPI) */
.ledger{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.ledger.three{grid-template-columns:repeat(3,1fr)}
.ledger > div{padding:18px 20px;border-left:1px solid var(--line-2);min-width:0}
.ledger > div:first-child{border-left:0}
.ledger .lab{font-size:12.5px;color:var(--ink-3);font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ledger .val{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:-.03em;line-height:1.15;margin-top:6px;white-space:nowrap}
.ledger .val small{font-size:15px;color:var(--ink-3);font-weight:600;margin-left:2px}
.ledger .foot{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.sw{width:8px;height:8px;border-radius:3px;display:inline-block}

/* ---------- Tower (signature) ---------- */
.tower{position:relative;border-radius:24px;color:var(--night-ink);overflow:hidden;isolation:isolate;
  background:linear-gradient(180deg,#0E0C1E 0%,#1A1633 38%,#2C2350 70%,#4A3561 88%,#5E3E5E 100%)}
.tower::before{content:"";position:absolute;inset:0;z-index:-2;pointer-events:none;background:
  radial-gradient(1.2px 1.2px at 8% 12%,#fff 50%,transparent),radial-gradient(1px 1px at 22% 26%,#fffb 50%,transparent),
  radial-gradient(1.4px 1.4px at 74% 9%,#fff 50%,transparent),radial-gradient(1px 1px at 92% 30%,#fff9 50%,transparent),
  radial-gradient(1px 1px at 58% 19%,#fffa 50%,transparent),radial-gradient(1.2px 1.2px at 38% 6%,#fffc 50%,transparent),
  radial-gradient(1px 1px at 14% 44%,#fff8 50%,transparent),radial-gradient(1px 1px at 86% 48%,#fff8 50%,transparent),
  radial-gradient(1.3px 1.3px at 96% 16%,#fffb 50%,transparent),radial-gradient(1px 1px at 4% 30%,#fff9 50%,transparent),
  radial-gradient(70% 45% at 50% 100%,rgba(255,150,90,.22),transparent 70%)}
.tower-head{display:flex;align-items:flex-start;gap:10px;padding:20px 20px 0;position:relative;z-index:2}
.tower-head .t1{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tower-head .t2{font-size:12.5px;color:var(--night-ink-2);margin-top:4px}
.tower-head .t2 .late{color:#FF9C94;font-weight:600}
.moon{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 34% 32%,#FFF8E6 0 30%,#F7E2A8 70%,#E9C97C);
  box-shadow:0 0 0 8px rgba(255,236,180,.05),0 0 0 18px rgba(255,236,180,.03),0 0 40px 6px rgba(255,220,140,.35)}
.moon::before,.moon::after{content:"";position:absolute;border-radius:50%;background:rgba(200,160,80,.28)}
.moon::before{width:7px;height:7px;top:9px;left:17px}
.moon::after{width:5px;height:5px;top:20px;left:10px}
.scene{position:relative;margin-top:-6px}
.skyline{position:absolute;left:0;right:0;bottom:46px;width:100%;height:58%;z-index:-1;pointer-events:none}
.cloud{position:absolute;height:10px;border-radius:99px;background:rgba(180,170,220,.10);filter:blur(1px);z-index:-1}
.cloud::before{content:"";position:absolute;left:22%;top:-6px;width:40%;height:14px;border-radius:99px;background:inherit}
.bld{position:relative;margin:0 auto;width:calc(100% - 92px);max-width:330px;padding-top:6px}
.roof{position:relative;height:46px;margin:0 22%}
.roof svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:100%;overflow:visible}
.beacon{animation:blink 2.4s infinite}
@keyframes blink{50%{opacity:.2}}
/* floors */
.floor{position:relative}
.floor .units{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:10px;padding:9px 10px 7px;
  background:linear-gradient(180deg,#4B4470,#3E3860 70%,#373154);
  box-shadow:inset 0 3px 0 #6A6292,inset 0 -1px 0 rgba(0,0,0,.35)}
/* side wall (depth) */
.floor .units::after{content:"";position:absolute;top:0;bottom:0;right:-12px;width:12px;background:linear-gradient(180deg,#2A2544,#221E38);
  clip-path:polygon(0 0,100% 7px,100% 100%,0 100%)}
.floor.f8 .units{margin:0 22%;border-radius:6px 6px 0 0}
.floor.f7 .units{margin:0 11%}
/* terraces on setbacks */
.floor.f7::before,.floor.f6::before{content:"";position:absolute;top:-9px;height:9px;z-index:0;
  background:repeating-linear-gradient(90deg,#8A82B4 0 1.5px,transparent 1.5px 6px) 0 2px/100% 7px no-repeat,linear-gradient(#9C94C6,#9C94C6) 0 0/100% 2px no-repeat}
.floor.f7::before{left:11%;right:11%}
.floor.f6::before{left:0;right:0}
.floor.f8 .units,.floor.f7 .units{z-index:1}
.planter{position:absolute;top:-16px;width:18px;height:16px;z-index:1;pointer-events:none}
/* unit = window + balcony */
.unit{position:relative;min-height:60px;border-radius:4px 4px 2px 2px;padding:7px 9px 17px;text-align:left;display:flex;flex-direction:column;justify-content:flex-start;
  color:var(--night-ink-2);overflow:hidden;background:#17142A;
  box-shadow:0 0 0 2px #2A2546,inset 0 0 0 1px rgba(0,0,0,.4);transition:transform .18s,box-shadow .25s,filter .25s}
.unit > *{position:relative;z-index:2}
/* curtains + mullion */
.unit::before{content:"";position:absolute;inset:0 0 13px;z-index:1;pointer-events:none;background:
  linear-gradient(90deg,var(--cur,transparent) 0 11%,transparent 11% 89%,var(--cur,transparent) 89%),
  linear-gradient(90deg,transparent calc(50% - 1px),rgba(20,16,40,.35) calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)),
  linear-gradient(180deg,rgba(255,255,255,.16),transparent 35%)}
/* balcony railing */
.unit::after{content:"";position:absolute;left:-2px;right:-2px;bottom:0;height:14px;z-index:3;pointer-events:none;background:
  linear-gradient(#B9B2DC,#B9B2DC) 0 0/100% 2px no-repeat,
  repeating-linear-gradient(90deg,rgba(200,194,232,.85) 0 1.5px,transparent 1.5px 6px) 0 2px/100% 9px no-repeat,
  linear-gradient(#5E5786,#4A4470) 0 11px/100% 3px no-repeat}
.unit:focus-visible{outline:2px solid #fff;outline-offset:3px}
.unit .u-no{font:700 15px/1 var(--f-mono);letter-spacing:.02em}
.unit .u-who{font-size:11px;line-height:1.2;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.unit .u-dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;z-index:4}
.u-dot.paid{background:#3BD28A;box-shadow:0 0 0 2px rgba(10,40,25,.35),0 0 8px #3BD28A}
.u-dot.due{background:transparent;border:1.5px solid currentColor}
.u-dot.none{display:none}
.u-badge{position:absolute!important;right:5px;bottom:17px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;z-index:4!important}
.u-badge svg{width:11px;height:11px}
/* statuses */
.unit.st-ok{--cur:rgba(206,120,40,.45);background:radial-gradient(120% 90% at 50% 20%,#FFF0C2,#FFD27A 45%,#F5A623);color:#3A2600;
  box-shadow:0 0 0 2px #2A2546,0 0 26px -2px rgba(255,190,80,.65)}
.unit.st-soon{--cur:rgba(80,50,10,.5);background:radial-gradient(120% 90% at 50% 20%,#D9A653,#A87A30 60%,#7A5620);color:#FFF1D2;
  box-shadow:0 0 0 2px #2A2546,0 0 16px -4px rgba(255,180,80,.45)}
.unit.st-soon .u-badge{background:#FFE2A6;color:#6B4A10}
.unit.st-late{--cur:rgba(120,20,30,.5);background:radial-gradient(120% 90% at 50% 25%,#7A2A36,#4A1724 70%);color:#FFD0CB;
  box-shadow:0 0 0 2px #E2574C,0 0 22px -2px rgba(255,90,78,.55)}
.unit.st-late .u-badge{background:#FF5A4E;color:#fff}
.unit.st-vacant{background:repeating-linear-gradient(180deg,#24203C 0 4px,#1B1830 4px 7px);color:#8E89AE}
.unit.st-vacant::before{background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 40%)}
@media (prefers-reduced-motion:no-preference){ .unit.st-late .u-badge{animation:ping 2s infinite} }
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,90,78,.7)}70%{box-shadow:0 0 0 7px rgba(255,90,78,0)}}
/* ground floor */
.floor.f1 .units{grid-template-columns:1fr 1fr;padding-bottom:0;background:linear-gradient(180deg,#524A78,#433C66)}
.floor.f1 .unit{margin-bottom:7px}
.lobby{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:67px}
.lobby .sign{position:absolute;top:0;left:50%;transform:translateX(-50%);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  font:700 9.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:#FFE7B0;padding:4px 7px;border-radius:3px;background:#221D3A;
  box-shadow:0 0 0 1px #6A6292,0 0 12px rgba(255,200,110,.35);text-shadow:0 0 6px rgba(255,200,110,.8)}
.lobby .awning{position:absolute;top:22px;left:4%;right:4%;height:6px;border-radius:2px;background:linear-gradient(#C9C2EA,#8E86BA);box-shadow:0 6px 14px -2px rgba(255,200,110,.45)}
.lobby .door{width:62%;height:36px;border-radius:3px 3px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:2px 2px 0;background:#2A2546}
.lobby .door i{background:linear-gradient(180deg,#FFF1C9,#FFC867 60%,#F2A33A);border-radius:1px;position:relative}
.lobby .door i::after{content:"";position:absolute;top:45%;width:2px;height:8px;border-radius:2px;background:#8A5B12}
.lobby .door i:first-child::after{right:3px}.lobby .door i:last-child::after{left:3px}
.lobby .step{width:78%;height:4px;background:#8E86BA;border-radius:1px 1px 0 0}
/* street */
.street{position:relative;height:46px;margin-top:-1px}
.street .road{position:absolute;inset:auto 0 0 0;width:100%;height:100%}
.street .tree,.street .lamp{position:absolute;bottom:22px;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;padding:14px 20px 16px;font-size:12px;color:var(--night-ink-2);background:rgba(10,8,20,.35)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
@media (prefers-reduced-motion:no-preference){
  .tower.anim .unit:not(.st-vacant){animation:lightsOn .8s both;animation-delay:calc(var(--i)*65ms + 200ms)}
  @keyframes lightsOn{0%{filter:brightness(.2) saturate(.2)}55%{filter:brightness(1.25)}70%{filter:brightness(.85)}100%{filter:none}}
  .tower .twinkle{animation:tw 3.5s infinite ease-in-out}
  @keyframes tw{50%{opacity:.25}}
}

/* ---------- Home ---------- */
.home{display:grid;grid-template-columns:minmax(330px,400px) minmax(0,1fr);gap:20px;align-items:start}
.home-right{display:grid;gap:20px;min-width:0}
.chart-box{position:relative;height:250px}
.alerts{display:flex;flex-direction:column}
.alert{display:flex;align-items:center;gap:12px;padding:11px 2px;border-top:1px solid var(--line-2);text-align:left;width:100%}
.alert:first-child{border-top:0}
.alert .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.alert .ic.bad{background:var(--bad-soft);color:var(--bad)}
.alert .ic.warn{background:var(--warn-soft);color:var(--warn)}
.alert .ic.info{background:var(--surface-2);color:var(--ink-2)}
.alert .tx{flex:1;min-width:0}
.alert .tx b{display:block;font-weight:600;font-size:14px}
.alert .tx span{font-size:12.5px;color:var(--ink-3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.banner{display:flex;align-items:center;gap:12px;background:var(--night);color:var(--night-ink);border-radius:16px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.banner .grow{flex:1}
.banner .btn{background:var(--night-2);border-color:var(--night-3);color:#fff}

.chart-box svg{display:block;overflow:visible}
.chart-box.sm{height:190px}
.viz-cap{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink-3);margin-bottom:6px}
.viz-cap span{display:inline-flex;align-items:center;gap:6px}
.viz-cap i{width:10px;height:10px;border-radius:3px;display:inline-block}
.viz-cap i.dash{width:14px;height:0;border-top:1.6px dashed var(--ink-2);border-radius:0}
.viz-cap .warnc{color:var(--bad);font-weight:600}
.donut-box svg{display:block;margin:auto;overflow:visible}
.catlist div{transition:opacity .15s;cursor:default;border-radius:8px}
.catlist div.dim{opacity:.4}
.viz-tip{position:fixed;left:0;top:0;z-index:70;pointer-events:none;min-width:170px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:0 14px 34px -12px rgba(20,20,40,.35);opacity:0;transition:opacity .12s}
.viz-tip.on{opacity:1}
.viz-tip .th{font-weight:700;margin-bottom:6px;font-family:var(--f-display)}
.viz-tip .tr{display:flex;align-items:center;gap:8px;padding:2px 0}
.viz-tip .tr i{width:10px;height:10px;border-radius:3px;flex:none}
.viz-tip .tr b{margin-left:auto;font-variant-numeric:tabular-nums;padding-left:12px}
.viz-tip .tn{margin-top:6px;font-size:12px;color:var(--ink-3);max-width:220px}
/* ---------- Utilities ---------- */
.util-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:16px}
.progress{height:8px;background:var(--line-2);border-radius:99px;overflow:hidden;min-width:120px;flex:1}
.progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--glow-2),var(--glow));border-radius:99px;transition:width .3s}
.ulist{display:flex;flex-direction:column}
.uhead,.urow{display:grid;grid-template-columns:132px minmax(0,1.35fr) minmax(0,1.35fr) minmax(0,.9fr) 190px;gap:16px;align-items:center}
.uhead{padding:0 16px 8px;font-size:12px;color:var(--ink-3);font-weight:600}
.urow{padding:12px 16px;border-top:1px solid var(--line-2)}
.urow:first-of-type{border-top:0}
.urow.paid{background:linear-gradient(90deg,var(--ok-soft),transparent 30%)}
.u-apt b{font:700 18px/1 var(--f-mono);display:block}
.u-apt span{font-size:12.5px;color:var(--ink-3);display:block;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u-cell label{display:none;font-size:12px;font-weight:600;color:var(--ink-3);margin-bottom:6px}
.mpair{display:flex;align-items:center;gap:6px}
.mpair .arr{color:var(--ink-3);font-size:12px}
.meter{width:100%;min-width:0;background:#15131F;color:#F4F1E6;border:1px solid #000;border-radius:7px;padding:7px 8px;font:600 14px/1.2 var(--f-mono);letter-spacing:.06em;text-align:right;box-shadow:inset 0 2px 5px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.4)}
.meter.prev{background:#2A2838;color:#B9B5CA}
.meter::placeholder{color:#5C5870}
.meter:focus{outline:2px solid var(--glow);outline-offset:1px}
.meter.err{box-shadow:inset 0 0 0 1.5px var(--bad)}
.ucalc{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12.5px}
.ucalc span{color:var(--ink-3)}
.ucalc b{font-weight:600}
.ucalc b.e{color:var(--elec)} .ucalc b.w{color:var(--water)} .ucalc b.l{color:var(--lavie)}
.ucalc .warnt{color:var(--bad);font-weight:600}
.stepper{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content}
.stepper button{width:34px;height:34px;font-size:18px;color:var(--ink-2)}
.stepper input{width:44px;text-align:center;border:0;background:none;font:700 15px var(--f-mono);padding:0}
.free{display:inline-flex;font-size:11.5px;font-weight:700;color:var(--water);background:rgba(31,116,214,.1);border-radius:6px;padding:1px 6px;margin-left:6px}
.u-total{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.u-total .tt{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.02em}
.u-total .acts{display:flex;gap:6px}
.paidbtn{border-radius:9px;padding:6px 10px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.paidbtn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;margin-top:16px}

/* ---------- Rent ---------- */
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;text-align:left;position:relative;overflow:hidden}
.rcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.rcard.st-ok::before{background:var(--glow)} .rcard.st-soon::before{background:var(--warn)} .rcard.st-late::before,.rcard.st-none::before{background:var(--bad)}
.rtop{display:flex;align-items:flex-start;gap:10px}
.rtop .no{font:700 24px/1 var(--f-mono)}
.rcard .who{font-weight:600;font-size:14px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rtop .grow{flex:1;min-width:0}
.rmeta{display:flex;gap:6px;flex-wrap:wrap}
.rbar{height:6px;border-radius:99px;background:var(--line-2);overflow:hidden}
.rbar i{display:block;height:100%;background:var(--glow-2);border-radius:99px}
.rfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-3)}
.plist{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2);font-size:14px}
.prow:first-child{border-top:0}
.prow .no{font:700 15px var(--f-mono)}
.prow small{display:block;color:var(--ink-3);font-size:12.5px}
.prow .amt{font-weight:700;white-space:nowrap}
.icon-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-3)}

/* ---------- Money ---------- */
.money{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
.rgroup{margin-top:6px}
.rgroup h4{margin:12px 0 4px;font-size:12px;color:var(--ink-3);font-weight:600;text-transform:none}
.rec{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line-2)}
.rec:first-of-type{border-top:0}
.check{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;color:transparent;transition:.15s}
.check.on{background:var(--c-salary);border-color:var(--c-salary);color:#fff}
.rec .nm{flex:1;min-width:0}
.rec .nm b{font-weight:600;font-size:14px;display:block}
.rec .nm span{font-size:12px;color:var(--ink-3)}
.rec .am{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.rec.done .nm b{color:var(--ink-3)}
.txrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.txrow:first-child{border-top:0}
.txrow .cat{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;color:#fff}
.txrow b{font-weight:600;font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txrow small{font-size:12.5px;color:var(--ink-3)}
.txrow .amt{font-weight:700;white-space:nowrap}
.txrow .amt.in{color:var(--ok)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.filters button{border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.donut-wrap{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center}
.donut-box{position:relative;height:170px}
.donut-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donut-c b{font-family:var(--f-display);font-size:20px;display:block}
.donut-c span{font-size:11.5px;color:var(--ink-3)}
.catlist div{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13.5px}
.catlist div b{margin-left:auto;font-variant-numeric:tabular-nums}

/* ---------- Settings ---------- */
.settings{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field .help{font-size:12px;color:var(--ink-3)}
.in{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:10px 12px;font-size:15px;min-width:0}
.in:focus{outline:2px solid var(--glow-2);outline-offset:0;background:var(--surface)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.aptrow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line-2);width:100%;text-align:left}
.aptrow:first-child{border-top:0}
.aptrow .no{font:700 15px var(--f-mono)}
.aptrow small{display:block;font-size:12.5px;color:var(--ink-3)}
.recedit{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) 120px 32px;gap:8px;align-items:center;margin-bottom:8px}
.recedit .in{padding:8px 10px;font-size:14px}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:7px 14px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.code{font:12.5px/1.5 var(--f-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;word-break:break-word}
.steps{margin:0;padding-left:20px;font-size:13.5px;color:var(--ink-2)}
.steps li{margin-bottom:6px}

/* ---------- Sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(14,12,24,.45);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:51;left:50%;top:50%;width:min(560px,calc(100vw - 32px));max-height:min(86vh,820px);transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;background:var(--surface);border-radius:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);display:flex;flex-direction:column;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
.sheet.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.sheet:not(.on){visibility:hidden;transition-property:opacity,transform,visibility;transition-delay:0s,0s,.3s}
.sheet-h{display:flex;align-items:center;gap:10px;padding:18px 20px 10px}
.sheet-h h3{font-size:21px;flex:1}
.sheet-b{padding:4px 20px 20px;overflow:auto;overscroll-behavior:contain}
.sheet .grab{display:none}
.sheet-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}

/* Bill receipt */
.receipt{background:var(--surface-2);border-radius:18px;padding:18px;border:1px solid var(--line);position:relative}
.receipt .rh{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.receipt .rh .no{font:700 30px/1 var(--f-mono)}
.receipt .line{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line-2)}
.receipt .line .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff}
.receipt .line small{display:block;color:var(--ink-3);font-size:12.5px;font-family:var(--f-mono)}
.receipt .tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px}
.receipt .tot b{font-family:var(--f-display);font-size:28px;letter-spacing:-.03em}

/* Toast */
.toasts{position:fixed;z-index:60;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--night);color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:tin .25s both;max-width:min(92vw,460px)}
.toast.bad{background:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* ---------- Mobile app layout ---------- */
@media (max-width:959px){
  body{font-size:15px}
  .app{display:block}
  .side{display:none}
  .main{padding:0 16px calc(104px + env(safe-area-inset-bottom))}
  .topbar{position:relative;flex-wrap:wrap;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 0 14px;background:none}
  .tb-title{flex:1 1 100%}
  .month-switch{flex:1 1 100%;justify-content:space-between}
  .tb-mobile{display:flex;align-items:center;gap:10px;width:100%}
  .tb-mobile .bn{flex:1;font-weight:600;font-size:13.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
  .sync-pill{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 11px}
  .topbar h1{font-size:30px}
  .topbar .sub{display:none}
  .month-switch{box-shadow:none}
  .month-switch .ml{min-width:96px;font-size:13.5px}
  .month-switch button{width:32px;height:32px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;z-index:30;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(29,27,44,.94);backdrop-filter:blur(14px);border-radius:24px;padding:7px;box-shadow:0 18px 40px -14px rgba(10,8,20,.6)}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:17px;color:var(--night-ink-2);font-size:10.5px;font-weight:600;position:relative}
  .tabbar button[aria-current="page"]{background:var(--night-2);color:#fff}
  .tabbar button[aria-current="page"] svg{color:var(--glow)}
  .tabbar .badge{position:absolute;top:3px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:99px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
  .card{padding:16px;border-radius:18px}
  .grid{gap:14px}
  .home{grid-template-columns:1fr;gap:14px}
  .home-right{gap:14px}
  .two,.money,.settings{grid-template-columns:1fr;gap:14px}
  .ledger{grid-template-columns:1fr 1fr}
  .ledger.three{grid-template-columns:1fr 1fr}
  .ledger.three > div:first-child{grid-column:1/-1;border-bottom:1px solid var(--line-2)}
  .ledger > div{padding:14px 16px}
  .ledger > div:nth-child(3){border-left:0}
  .ledger:not(.three) > div:nth-child(n+3){border-top:1px solid var(--line-2)}
  .ledger.three > div:nth-child(2){border-left:0}
  .ledger .val{font-size:23px}
  .chart-box{height:210px}
  .tower{border-radius:22px}
  .tower-head{padding:16px 16px 0}
  .bld{width:calc(100% - 80px)}
  .unit{min-height:56px;padding:6px 8px 17px}
  .legend{padding:12px 16px 14px}
  .uhead{display:none}
  .ulist{gap:12px}
  .urow{grid-template-columns:1fr auto;grid-template-areas:"apt tot" "e e" "w w" "l l";gap:14px 12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
  .urow.paid{background:var(--surface);box-shadow:inset 4px 0 0 var(--ok),var(--shadow)}
  .ulist.card-wrap{background:none;border:0;box-shadow:none;padding:0}
  .u-apt{grid-area:apt}.u-e{grid-area:e}.u-w{grid-area:w}.u-l{grid-area:l}.u-total{grid-area:tot}
  .u-cell label{display:flex;align-items:center}
  .u-l{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .u-l label{margin:0}
  .meter{font-size:16px;padding:9px 10px}
  .u-total .tt{font-size:19px}
  .rgrid{grid-template-columns:1fr;gap:10px}
  .donut-wrap{grid-template-columns:130px 1fr}
  .donut-box{height:130px}
  .recedit{grid-template-columns:1fr 1fr;}
  .recedit .in.amt{grid-column:1}
  /* bottom sheet */
  .sheet{left:0;right:0;top:auto;bottom:0;width:100%;max-height:92vh;border-radius:26px 26px 0 0;transform:translateY(100%);opacity:1;transition:transform .3s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
  .sheet.on{transform:translateY(0)}
  .sheet .grab{display:block;width:40px;height:5px;border-radius:99px;background:var(--line);margin:8px auto 0}
  .sheet-h{padding:10px 18px 8px}
  .sheet-b{padding:4px 18px 22px}
  .sheet-actions .btn{flex:1}
  .toasts{bottom:calc(96px + env(safe-area-inset-bottom))}
  .in{font-size:16px}
}
@media (max-width:480px){ .hide-s{display:none} }
@media (max-width:380px){ .ledger .val{font-size:20px} .bld{width:calc(100% - 56px)} .unit .u-who{font-size:10px} }

/* ---------- Cảm giác chạm & chuyển động ---------- */
@media (hover:hover) and (pointer:fine){
  .nav button:hover{background:var(--night-2);color:var(--night-ink)}
  .month-switch button:hover{background:var(--surface-2)}
  .unit:hover{transform:translateY(-1px);filter:brightness(1.08)}
  .icon-btn:hover{background:var(--surface-2);color:var(--bad)}
  .btn:hover{filter:brightness(.97)} .btn.primary:hover,.btn.glow:hover{filter:brightness(1.08)}
  .alert:hover,.txrow:hover,.aptrow:hover{background-color:var(--surface-2)}
  .rcard:hover{box-shadow:0 1px 2px rgba(20,20,40,.05),0 16px 34px -18px rgba(20,20,40,.28)}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.paidbtn,.check,.rcard,.alert,.txrow,.aptrow,.tabbar button,.nav button,.month-switch button,.stepper button,.icon-btn,.filters button,.seg button,.sync-pill,.btn-glow{
    transition:transform .16s cubic-bezier(.2,.8,.2,1),background-color .15s,color .15s,box-shadow .2s,filter .15s}
  .btn:active,.paidbtn:active,.tabbar button:active,.nav button:active,.month-switch button:active,.stepper button:active,.icon-btn:active,.filters button:active,.seg button:active,.sync-pill:active,.btn-glow:active{transform:scale(.96)}
  .check:active{transform:scale(.88)}
  .rcard:active,.alert:active,.txrow:active,.aptrow:active{transform:scale(.985)}
  .unit:active{transform:scale(.95)}
  .check.on{animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
  #view.enter{animation:viewIn .3s cubic-bezier(.2,.8,.2,1) both}
  @keyframes viewIn{from{opacity:0;transform:translateY(8px)}}
  .tabbar button[aria-current="page"] svg{animation:tabPop .32s cubic-bezier(.3,1.5,.5,1)}
  @keyframes tabPop{0%{transform:scale(.7)}100%{transform:scale(1)}}
  .toast{animation:tin .32s cubic-bezier(.2,1.2,.4,1) both}
}
.sheet.drag{transition:none!important}
/* vùng chạm tối thiểu ~44px trên màn hình cảm ứng */
@media (pointer:coarse){
  .stepper button{width:44px;height:44px}
  .stepper input{width:40px}
  .month-switch button{width:44px;height:44px}
  .icon-btn{width:44px;height:44px}
  .btn.sm{min-height:40px}
  .paidbtn{min-height:40px;padding:8px 12px}
  .check{width:30px;height:30px}
  .filters button{padding:8px 13px}
  .sheet .grab{width:48px;margin-top:10px}
}
@media (max-width:959px){
  .main{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .sheet{max-height:92dvh}
  .sheet-h{touch-action:none}
  .tabbar{user-select:none;-webkit-user-select:none}
}
</style>
</head>

<script>
/* =========================================================

   Dữ liệu: data.json (GitHub) + bản nháp trong máy (localStorage)
   ========================================================= */
const APTS=['100','201','202','301','302','401','402','501','502','601','602','700','800'];
const FLOORS=[['800'],['700'],['601','602'],['501','502'],['401','402'],['301','302'],['201','202'],['100']];
const CATS={
  suachua:{name:'Sửa chữa & vật tư',v:'--c-repair',ic:'tool'},
  luong:{name:'Lương & chi định kỳ',v:'--c-salary',ic:'people'},
  ngoai:{name:'Chi bên ngoài',v:'--c-outside',ic:'out'},
  khac:{name:'Khác',v:'--c-other',ic:'dots'}
};
const GROUPS=['Tổ bảo vệ','Tổ làm phòng','Gia đình & khác'];
const LS={data:'sotoanha.data',meta:'sotoanha.meta',gh:'sotoanha.github',backup:'sotoanha.backup',theme:'sotoanha.theme'};

/* ---------- utils ---------- */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const isNum=v=>typeof v==='number'&&isFinite(v);
const NF=new Intl.NumberFormat('vi-VN');
const fmt=n=>isNum(n)?NF.format(Math.round(n)):'—';
const vnd=n=>isNum(n)?NF.format(Math.round(n))+'đ':'—';
const short=n=>{if(!isNum(n))return'—';const a=Math.abs(n);const f=(x,d)=>(+x.toFixed(d)).toString().replace('.',',');
  if(a>=1e9)return f(n/1e9,2)+' tỷ'; if(a>=1e6)return f(n/1e6,a>=1e8?0:1)+'tr'; if(a>=1e3)return f(n/1e3,0)+'k'; return String(n)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const thisMonth=()=>todayISO().slice(0,7);
const addM=(k,n)=>{let[y,m]=k.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return `${y}-${pad(m)}`};
const diffM=(a,b)=>{const[ya,ma]=a.split('-').map(Number),[yb,mb]=b.split('-').map(Number);return (ya*12+ma)-(yb*12+mb)};
const mLabel=k=>`Tháng ${+k.slice(5)}/${k.slice(0,4)}`;
const mShort=k=>`T${+k.slice(5)}/${k.slice(2,4)}`;
const dLabel=iso=>iso?`${iso.slice(8,10)}/${iso.slice(5,7)}/${iso.slice(0,4)}`:'';
function parseMoney(s){
  if(s==null)return NaN; s=String(s).trim().toLowerCase().replace(/\s|đ|vnd/g,'');
  if(!s)return NaN;
  let mul=1; if(/(tr|triệu|m)$/.test(s)){mul=1e6;s=s.replace(/(tr|triệu|m)$/,'')} else if(/(k|nghìn|ngàn)$/.test(s)){mul=1e3;s=s.replace(/(k|nghìn|ngàn)$/,'')}
  if(mul>1){s=s.replace(',','.')} else {s=s.replace(/[.,]/g,'')}
  const n=parseFloat(s); return isFinite(n)?Math.round(n*mul):NaN;
}
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  download:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  upload:'<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>',

  phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1z"/>'
};
const icon=(n,s=20,w=1.9)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;

/* ---------- data model ---------- */
function defaultRecurring(){
  const r=(who,group,role)=>({id:uid(),who,group,role,cat:'luong',amount:0});
  return [r('Liêm','Tổ bảo vệ','Bảo vệ'),r('Thắng','Tổ bảo vệ','Bảo vệ'),r('Tuấn Anh','Tổ bảo vệ','Bảo vệ'),
    r('Ánh','Tổ làm phòng','Làm phòng'),r('Toan','Tổ làm phòng','Làm phòng'),r('Thuỷ','Tổ làm phòng','Làm phòng'),
    r('Ông bà ngoại','Gia đình & khác','Tiền gửi hàng tháng'),r('Minh','Gia đình & khác','Lương Minh'),
    r('Anh Lãng','Gia đình & khác','Làm vườn – Nha Trang (chỗ mẹ Thu)'),r('Cô Phượng','Gia đình & khác','Kế toán')];
}
const PORTAL_DEFAULT={owner:'',repo:'so-toa-nha',branch:'main',dir:'vault',siteUrl:'',bank:'',account:'',holder:''};
function emptyDB(){
  return {version:1,updatedAt:null,
    settings:{buildingName:'Nhà Minh',electricPrice:4000,waterPrice:15000,laviePrice:75000,readingDay:20},
    apartments:APTS.map(id=>({id,tenant:'',phone:'',waterFree:false,rent:0,cycle:1,note:''})),
    readings:{},rentPayments:[],transactions:[],recurring:defaultRecurring()};
}
function normalize(d){
  const e=emptyDB(); d=d&&typeof d==='object'?d:e;
  d.settings=Object.assign({},e.settings,d.settings||{});
  d.settings.portal=Object.assign({},PORTAL_DEFAULT,d.settings.portal||{});
  const map=Object.fromEntries((d.apartments||[]).map(a=>[String(a.id),a]));
  d.apartments=APTS.map(id=>Object.assign({id,tenant:'',phone:'',waterFree:false,rent:0,cycle:1,note:'',portalPass:'',portalSalt:''},map[id]||{},{id}));
  d.readings=d.readings||{}; d.rentPayments=d.rentPayments||[]; d.transactions=d.transactions||[];
  d.recurring=Array.isArray(d.recurring)?d.recurring:e.recurring;
  d.rentPayments.forEach(p=>{p.id=p.id||uid();p.months=+p.months||1;p.amount=+p.amount||0});
  d.transactions.forEach(t=>{t.id=t.id||uid();t.amount=+t.amount||0;t.kind=t.kind||'chi';t.cat=t.cat||'khac'});
  d.recurring.forEach(r=>{r.id=r.id||uid();r.amount=+r.amount||0;r.cat=r.cat||'luong';r.group=r.group||'Gia đình & khác'});
  return d;
}
let DB=emptyDB();
let DEMO=null; // when viewing sample data, real DB is stashed here
const apt=id=>DB.apartments.find(a=>a.id===id);
const read=(m,id)=>DB.readings[m]?.[id]||{};
function setRead(m,id,k,v){
  DB.readings[m]=DB.readings[m]||{}; const r=DB.readings[m][id]=DB.readings[m][id]||{};
  if(v===null||v===''||v===undefined) delete r[k]; else r[k]=v;
  if(!Object.keys(r).length) delete DB.readings[m][id];
  if(!Object.keys(DB.readings[m]).length) delete DB.readings[m];
}
function bill(id,m){
  const s=DB.settings,a=apt(id),cur=read(m,id),prv=read(addM(m,-1),id);
  const eu=isNum(cur.e)&&isNum(prv.e)?cur.e-prv.e:null;
  const wu=isNum(cur.w)&&isNum(prv.w)?cur.w-prv.w:null;
  const em=eu!=null?Math.max(0,eu)*s.electricPrice:null;
  const wm=a.waterFree?0:(wu!=null?Math.max(0,wu)*s.waterPrice:null);
  const ln=isNum(cur.lavie)?cur.lavie:0, lm=ln*s.laviePrice;
  const entered=isNum(cur.e)||isNum(cur.w)||ln>0;
  const total=(em||0)+(wm||0)+lm;
  return {a,cur,prv,eu,wu,em,wm,ln,lm,total,entered,complete:eu!=null&&(a.waterFree||wu!=null),paid:!!cur.paid};
}
function paidThrough(id){
  const ps=DB.rentPayments.filter(p=>p.apt===id&&p.fromMonth);
  if(!ps.length)return null; return ps.map(p=>addM(p.fromMonth,(p.months||1)-1)).sort().pop();
}
function rentStatus(id){
  const a=apt(id); if(!a.tenant)return{st:'vacant',label:'Căn trống'};
  const t=paidThrough(id), cur=thisMonth();
  if(!t)return{st:'none',label:'Chưa ghi nhận thanh toán'};
  const d=diffM(t,cur);
  if(d<0)return{st:'late',through:t,late:-d,label:`Quá hạn ${-d} tháng`};
  if(d===0)return{st:'soon',through:t,label:'Hết hạn cuối tháng này'};
  return{st:'ok',through:t,ahead:d,label:`Đã trả đến hết ${mShort(t)}`};
}
const stClass=st=>st==='none'?'late':st;
const txMonth=t=>(t.date||'').slice(0,7);
function monthSummary(m){
  let utilDue=0,utilPaid=0,entered=0;
  APTS.forEach(id=>{const b=bill(id,m);if(b.entered){entered++;utilDue+=b.total;if(b.paid)utilPaid+=b.total}});
  const rent=DB.rentPayments.filter(p=>(p.date||'').slice(0,7)===m).reduce((s,p)=>s+p.amount,0);
  const txs=DB.transactions.filter(t=>txMonth(t)===m);
  const otherIn=txs.filter(t=>t.kind==='thu').reduce((s,t)=>s+t.amount,0);
  const out=txs.filter(t=>t.kind==='chi');
  const expense=out.reduce((s,t)=>s+t.amount,0);
  const byCat={}; out.forEach(t=>byCat[t.cat]=(byCat[t.cat]||0)+t.amount);
  const income=utilPaid+rent+otherIn;
  return{utilDue,utilPaid,utilUnpaid:utilDue-utilPaid,entered,rent,otherIn,income,expense,net:income-expense,byCat};
}
function recurTx(r,m){return DB.transactions.find(t=>t.recurId===r.id&&txMonth(t)===m)}

/* ---------- persistence & GitHub sync ---------- */
let META={sha:null,dirty:false,syncedAt:null};
let SYNC={state:'local',msg:''}; // local | ok | dirty | busy | err | demo
const lsGet=(k,f=null)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch{}};
const gh=()=>lsGet(LS.gh);
const ghReady=(g=gh())=>!!(g&&g.owner&&g.repo&&g.token);
function b64enc(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64dec(s){const bin=atob(s.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
function ghUrl(g){return `https://api.github.com/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}/contents/${(g.path||'data.json').split('/').map(encodeURIComponent).join('/')}`}
function ghHeaders(g){return{Authorization:`Bearer ${g.token}`,Accept:'application/vnd.github+json'}}
function ghErr(st){return({401:'Token sai hoặc đã hết hạn',403:'Token không có quyền ghi vào repo này',404:'Không tìm thấy repo hoặc nhánh',409:'Dữ liệu trên GitHub vừa thay đổi',422:'Dữ liệu trên GitHub vừa thay đổi'})[st]||`GitHub trả lỗi ${st}`}
async function ghGet(g){
  const r=await fetch(`${ghUrl(g)}?ref=${encodeURIComponent(g.branch||'main')}`,{headers:ghHeaders(g),cache:'no-store'});
  if(r.status===404){const rr=await fetch(`https://api.github.com/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}`,{headers:ghHeaders(g)});if(!rr.ok)throw Object.assign(new Error(ghErr(rr.status)),{status:rr.status});return{data:null,sha:null}}
  if(!r.ok)throw Object.assign(new Error(ghErr(r.status)),{status:r.status});
  const j=await r.json(); let c=j.content;
  if(!c&&j.sha){const br=await fetch(`https://api.github.com/repos/${encodeURIComponent(g.owner)}/${encodeURIComponent(g.repo)}/git/blobs/${j.sha}`,{headers:ghHeaders(g),cache:'no-store'});if(!br.ok)throw Object.assign(new Error(ghErr(br.status)),{status:br.status});c=(await br.json()).content} // file > 1MB
  return{data:JSON.parse(b64dec(c)),sha:j.sha};
}
async function ghPut(g,data,sha){
  const body={message:`Cập nhật sổ tòa nhà — ${new Date().toLocaleString('vi-VN')}`,content:b64enc(JSON.stringify(data,null,2)+'\n'),branch:g.branch||'main'};
  if(sha)body.sha=sha;
  const r=await fetch(ghUrl(g),{method:'PUT',headers:{...ghHeaders(g),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!r.ok)throw Object.assign(new Error(ghErr(r.status)),{status:r.status});
  return (await r.json()).content.sha;
}
function saveLocal(){if(DEMO)return;lsSet(LS.data,DB);lsSet(LS.meta,META)}
let syncTimer=null, REV=0, syncAgain=false;
function commit(){
  if(DEMO){renderSyncUI();return}
  REV++; DB.updatedAt=new Date().toISOString(); META.dirty=true; saveLocal();
  SYNC.state=ghReady()?'dirty':'local'; renderSyncUI();
  if(ghReady()){clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(),1800)}
}
let syncing=false;
async function sync(force=false){
  if(DEMO){toast('Đang xem dữ liệu mẫu — không lưu lên GitHub');return}
  const g=gh(); if(!ghReady(g)){toast('Chưa kết nối GitHub. Vào Cài đặt → Đồng bộ GitHub.');go('settings');return}
  if(syncing){syncAgain=true;return} if(!META.dirty&&!force){toast('Dữ liệu đã được lưu trên GitHub');return}
  syncing=true; syncAgain=false; SYNC.state='busy'; renderSyncUI();
  const rev=REV;
  try{
    META.sha=await ghPut(g,DB,META.sha); META.syncedAt=Date.now();
    // chỉ đánh dấu "đã lưu" nếu không có sửa đổi mới trong lúc đang tải lên
    if(REV===rev){META.dirty=false;SYNC.state='ok'}else{SYNC.state='dirty';syncAgain=true}
    saveLocal();
    setTimeout(()=>publishVault(),0);
  }catch(e){
    if(e.status===409||e.status===422){syncing=false;return resolveConflict()}
    SYNC.state='err'; SYNC.msg=e.message; toast('Chưa lưu được: '+e.message,'bad');
  }
  syncing=false; renderSyncUI();
  if(syncAgain&&META.dirty&&SYNC.state!=='err'){syncAgain=false;clearTimeout(syncTimer);syncTimer=setTimeout(()=>sync(),600)}
}
async function resolveConflict(){
  const g=gh(); let remote;
  try{remote=await ghGet(g)}catch(e){SYNC.state='err';SYNC.msg=e.message;renderSyncUI();return}
  const keepLocal=await ask('Dữ liệu trên GitHub vừa được sửa ở nơi khác',

  if(keepLocal){lsSet(LS.backup,{at:Date.now(),data:remote.data});META.sha=remote.sha;META.dirty=true;return sync(true)}

}
async function pullRemote(silent){
  const g=gh(); if(!ghReady(g))return;
  SYNC.state='busy';renderSyncUI();
  try{
    const {data,sha}=await ghGet(g);
    if(!data){META.sha=null;META.dirty=true;SYNC.state='dirty';renderSyncUI();if(!silent)toast('Repo chưa có data.json — sẽ tạo khi lưu');return}
    if(META.dirty&&META.sha!==sha){return resolveConflict()}
    if(META.dirty&&META.sha===sha){SYNC.state='dirty';renderSyncUI();return sync()}
    DB=normalize(data);META={...META,sha,dirty:false,syncedAt:Date.now()};saveLocal();SYNC.state='ok';render();
    if(!silent)toast('Đã tải dữ liệu mới nhất');
    publishVault();
  }catch(e){SYNC.state='err';SYNC.msg=e.message;renderSyncUI();toast('Không kết nối được GitHub: '+e.message,'bad')}
}

/* ---------- tenant portal: encrypt & publish ---------- */
const PB_ITER=210000;
const b64=buf=>{const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const normPass=s=>String(s||'').normalize('NFC').toLowerCase().replace(/[\s-]/g,'');
function genPass(){const A='abcdefghjkmnpqrstuvwxyz23456789',r=crypto.getRandomValues(new Uint8Array(8));const s=[...r].map(x=>A[x%A.length]).join('');return s.slice(0,4)+'-'+s.slice(4)}
const genSalt=()=>b64(crypto.getRandomValues(new Uint8Array(16)));
const keyCache=new Map();
async function portalKey(pass,salt){const k=pass+'|'+salt;if(keyCache.has(k))return keyCache.get(k);
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(normPass(pass)),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:unb64(salt),iterations:PB_ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt']);
  keyCache.set(k,key);return key}
async function sha256(s){return b64(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))}
function portalCfg(){const P=DB.settings.portal||PORTAL_DEFAULT,g=gh()||{};const owner=P.owner||g.owner||'';const repo=P.repo||'so-toa-nha';
  return{...P,owner,repo,branch:P.branch||'main',dir:(P.dir||'vault').replace(/^\/+|\/+$/g,''),siteUrl:P.siteUrl||(owner?`https://${owner.toLowerCase()}.github.io/${repo}/khach.html`:'')}}
function tenantPayload(id){
  const a=apt(id),s=DB.settings,P=portalCfg();
  const months=Object.keys(DB.readings).filter(m=>{const r=read(m,id);return isNum(r.e)||isNum(r.w)||r.lavie>0}).sort().filter(m=>{const b=bill(id,m);return b.eu!=null||b.wu!=null||b.ln>0});
  const bills=months.slice(-12).map(m=>{const b=bill(id,m);return{m,pe:b.prv.e??null,ce:b.cur.e??null,eu:b.eu,em:b.em,pw:b.prv.w??null,cw:b.cur.w??null,wu:b.wu,wm:b.wm,ln:b.ln,lm:b.lm,total:b.total,paid:b.paid}});
  const rs=rentStatus(id);
  const pays=DB.rentPayments.filter(p=>p.apt===id).sort((x,y)=>(y.date||'').localeCompare(x.date||'')).slice(0,6).map(p=>({date:p.date,fromMonth:p.fromMonth,months:p.months,amount:p.amount}));
  return{v:1,apt:id,tenant:a.tenant||'',building:s.buildingName,readingDay:s.readingDay,prices:{e:s.electricPrice,w:s.waterPrice,l:s.laviePrice},waterFree:!!a.waterFree,bills,
    rent:a.rent?{rent:a.rent,cycle:a.cycle,st:rs.st,label:rs.label,through:rs.through||null,ahead:rs.through?diffM(rs.through,thisMonth()):0,payments:pays}:null,
    pay:{bank:P.bank||'',account:P.account||'',holder:P.holder||''}};
}
async function ghApi(g,method,path,body){
  const r=await fetch('https://api.github.com'+path,{method,headers:{...ghHeaders(g),'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});
  if(!r.ok)throw Object.assign(new Error(ghErr(r.status)),{status:r.status});
  return r.status===204?null:r.json();
}
let publishing=false;
async function publishVault(force){
  const g=gh(),P=portalCfg();
  if(DEMO||!ghReady(g)||!P.owner||!P.repo)return;
  const withPass=DB.apartments.filter(a=>a.portalPass&&a.portalSalt);
  if(!withPass.length&&!Object.keys(META.vault||{}).length&&!force)return;
  if(publishing)return; publishing=true;
  try{
    const prev=META.vault||{},next={},put=[];
    for(const a of withPass){
      const p=tenantPayload(a.id),h=await sha256(JSON.stringify(p)+a.portalSalt+a.portalPass);next[a.id]=h;
      if(!force&&prev[a.id]===h)continue;
      const key=await portalKey(a.portalPass,a.portalSalt),iv=crypto.getRandomValues(new Uint8Array(12));
      const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify({...p,generatedAt:new Date().toISOString()})));
      put.push({path:`${P.dir}/${a.id}.json`,mode:'100644',type:'blob',content:JSON.stringify({v:1,alg:'AES-256-GCM',kdf:'PBKDF2-SHA256',iter:PB_ITER,salt:a.portalSalt,iv:b64(iv),ct:b64(ct)})+'\n'});
    }
    const O=encodeURIComponent(P.owner),R=encodeURIComponent(P.repo),B=encodeURIComponent(P.branch);
    const ref=await ghApi(g,'GET',`/repos/${O}/${R}/git/ref/heads/${B}`);
    const commit=await ghApi(g,'GET',`/repos/${O}/${R}/git/commits/${ref.object.sha}`);
    const tree=await ghApi(g,'GET',`/repos/${O}/${R}/git/trees/${commit.tree.sha}?recursive=1`);
    const keep=new Set(withPass.map(a=>`${P.dir}/${a.id}.json`));
    const del=(tree.tree||[]).filter(t=>t.type==='blob'&&t.path.startsWith(P.dir+'/')&&/\/\d{3}\.json$/.test(t.path)&&!keep.has(t.path)).map(t=>({path:t.path,mode:'100644',type:'blob',sha:null}));
    const existing=new Set((tree.tree||[]).map(t=>t.path));
    // also (re)write files missing on GitHub even if hash unchanged on this device
    for(const a of withPass){const pth=`${P.dir}/${a.id}.json`;if(!existing.has(pth)&&!put.some(x=>x.path===pth)){META.vault=Object.assign({},META.vault,{[a.id]:''});publishing=false;return await publishVault(true)}}
    if(!put.length&&!del.length){META.vault=next;saveLocal();return}
    const nt=await ghApi(g,'POST',`/repos/${O}/${R}/git/trees`,{base_tree:commit.tree.sha,tree:[...put,...del]});
    const nc=await ghApi(g,'POST',`/repos/${O}/${R}/git/commits`,{message:`Cập nhật hóa đơn khách thuê (${put.length} căn${del.length?`, thu hồi ${del.length}`:''})`,tree:nt.sha,parents:[ref.object.sha]});
    await ghApi(g,'PATCH',`/repos/${O}/${R}/git/refs/heads/${B}`,{sha:nc.sha});
    META.vault=next;META.vaultAt=Date.now();saveLocal();
    if(state.tab==='settings')render();
    toast(`Đã cập nhật trang hóa đơn cho ${put.length} căn`);
  }catch(e){toast(`Chưa cập nhật được trang khách: ${e.message}. Token cần quyền Contents (ghi) trên repo ${P.repo}.`,'bad')}
  finally{publishing=false}
}
function portalMsg(id){const a=apt(id),P=portalCfg();return [`🏢 ${DB.settings.buildingName} – Tài khoản xem hóa đơn`,`Căn: ${id}`,`Mật khẩu: ${a.portalPass}`,`Xem tại: ${P.siteUrl||'(chưa có link)'}#${id}`,'','Mở link, nhập số căn và mật khẩu để xem hóa đơn điện nước, tiền nhà hằng tháng. Vui lòng không chia sẻ mật khẩu.'].join('\n')}

  const cur=addM(thisMonth(),0), start=addM(cur,-12);
  let seed=7; const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const base={};APTS.forEach((id,i)=>base[id]={e:2000+i*731,w:300+i*41});
  for(let k=0;k<=12;k++){
    const m=addM(start,k);

      if(!apt(id)&&false)return;

      base[id].w+=Math.round(6+rnd()*9);
      const r={e:base[id].e,w:base[id].w};
      if(k>0){r.lavie=Math.floor(rnd()*4);if(k<12||rnd()>.45)r.paid=true}
      d.readings[m]=d.readings[m]||{}; d.readings[m][id]=r;
    });
    if(k===0)continue;
    d.recurring.forEach(r=>{if(k<12||rnd()>.4)d.transactions.push({id:uid(),date:`${m}-0${1+Math.floor(rnd()*5)}`,kind:'chi',cat:'luong',who:r.who,note:r.role,amount:r.amount,recurId:r.id})});
    const extra=[['suachua','Thay bóng đèn hành lang',850000],['suachua','Sửa máy bơm nước',2400000],['suachua','Mua sơn, vật tư',1600000],['ngoai','Công an phường',1000000],['ngoai','Bố mẹ gửi biếu',3000000]];
    extra.forEach(([cat,who,amt])=>{if(rnd()>.55)d.transactions.push({id:uid(),date:`${m}-${pad(8+Math.floor(rnd()*18))}`,kind:'chi',cat,who,amount:Math.round(amt*(.7+rnd()*.8)/1e4)*1e4})});
  }
  d.apartments.forEach(a=>{
    if(!a.tenant)return; let m=addM(start,-(a.cycle>1?(+a.id%a.cycle):0)); const lateBy=a.id==='402'?2:a.id==='601'?1:0;
    while(diffM(m,cur)<=1-lateBy-(a.id==='202'?1:0)){

      m=addM(m,a.cycle);
    }
  });
  return d;
}

function alertsHTML(){
  const m=state.month, out=[];
  APTS.forEach(id=>{const rs=rentStatus(id),a=apt(id);
    if(rs.st==='late')out.push(['bad','alert',`Căn ${id} quá hạn tiền nhà ${rs.late} tháng`,`${esc(a.tenant)} · đã trả đến ${mShort(rs.through)} · ${vnd(a.rent)}/tháng`,`apt`,id]);
    else if(rs.st==='none')out.push(['bad','alert',`Căn ${id} chưa có thanh toán nào`,`${esc(a.tenant)} · ghi nhận lần trả đầu tiên`,`apt`,id]);
    else if(rs.st==='soon')out.push(['warn','clock',`Căn ${id} hết hạn tiền nhà cuối tháng`,`${esc(a.tenant)} · trả ${a.cycle} tháng/lần · ${vnd(a.rent*a.cycle)}`,`apt`,id]);
  });
  const notEntered=APTS.filter(id=>apt(id).tenant&&!isNum(read(m,id).e)).length;
  if(notEntered)out.push(['info','bolt',`${notEntered} căn chưa nhập số điện ${mShort(m)}`,`Chụp công tơ ngày ${DB.settings.readingDay} rồi nhập trong mục Điện nước`,'nav','util']);
  const unpaid=APTS.filter(id=>{const b=bill(id,m);return b.entered&&!b.paid&&b.total>0});
  if(unpaid.length)out.push(['warn','receipt',`${unpaid.length} hóa đơn điện nước chưa thu`,`Còn ${vnd(unpaid.reduce((s,id)=>s+bill(id,m).total,0))} · căn ${unpaid.join(', ')}`,'nav','util']);
  const rec=DB.recurring, left=rec.filter(r=>!recurTx(r,m));

  if(!out.length)return `<div class="empty"><b>Không có việc gì tồn đọng</b>Tiền nhà, điện nước và chi cố định đều đã xong.</div>`;

}

/* ---------- d3 charts ---------- */
const D3OK=()=>!!window.d3;
function tipEl(){let t=document.getElementById('vizTip');if(!t){t=document.createElement('div');t.id='vizTip';t.className='viz-tip';t.setAttribute('role','status');document.body.appendChild(t)}return t}
function tipShow(html,ev){const t=tipEl();t.innerHTML=html;t.classList.add('on');const r=t.getBoundingClientRect(),pad=12;
  let x=ev.clientX+14,y=ev.clientY-r.height-12;if(x+r.width>innerWidth-pad)x=ev.clientX-r.width-14;if(x<pad)x=pad;if(y<pad)y=ev.clientY+16;t.style.transform=`translate(${x}px,${y}px)`}
function tipHide(){document.getElementById('vizTip')?.classList.remove('on')}
const vizRow=(c,l,v,line)=>`<div class="tr"><i style="background:${c}${line?';height:3px;border-radius:2px':''}"></i><span>${l}</span><b>${v}</b></div>`;
function vizNoD3(el){el.innerHTML='<div class="empty" style="padding:40px 10px">Không tải được thư viện biểu đồ. Kiểm tra mạng rồi mở lại trang.</div>'}
function roundTop(x,y,w,h,r){r=Math.min(r,w/2,h);if(h<=0)return'';return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}

/* Home: income vs expense, 12 months, net as a line on the same axis */
function drawFlow(el){
  if(!el)return; if(!D3OK())return vizNoD3(el);
  const ms=[...Array(12)].map((_,i)=>addM(state.month,i-11)), data=ms.map(m=>({m,...monthSummary(m)}));
  const W=el.clientWidth||600,H=el.clientHeight||250,M={t:12,r:6,b:26,l:44},iw=W-M.l-M.r,ih=H-M.t-M.b;
  const cIn=cssv('--ok'),cOut=cssv('--c-salary'),cNet=cssv('--glow-2'),ink3=cssv('--ink-3'),grid=cssv('--line-2'),surf=cssv('--surface');
  const x=d3.scaleBand().domain(ms).range([0,iw]).paddingInner(.28).paddingOuter(.1);
  const lo=Math.min(0,d3.min(data,d=>d.net)), hi=d3.max(data,d=>Math.max(d.income,d.expense))||1;
  const y=d3.scaleLinear().domain([lo,hi]).nice(4).range([ih,0]);
  const sub=x.bandwidth()/2-1;
  el.innerHTML='';
  const svg=d3.select(el).append('svg').attr('width',W).attr('height',H).attr('role','img').attr('aria-label','Biểu đồ thu, chi và còn lại 12 tháng gần nhất');
  const g=svg.append('g').attr('transform',`translate(${M.l},${M.t})`);
  g.append('g').selectAll('line').data(y.ticks(4)).join('line').attr('x1',0).attr('x2',iw).attr('y1',d=>y(d)).attr('y2',d=>y(d)).attr('stroke',d=>d===0?cssv('--line'):grid);
  g.append('g').selectAll('text').data(y.ticks(4)).join('text').attr('x',-8).attr('y',d=>y(d)).attr('dy','.32em').attr('text-anchor','end').attr('fill',ink3).attr('font-size',11).text(d=>d===0?'0':short(d));
  g.append('g').selectAll('text').data(ms).join('text').attr('x',d=>x(d)+x.bandwidth()/2).attr('y',ih+18).attr('text-anchor','middle').attr('font-size',11)
    .attr('fill',d=>d===state.month?cssv('--ink'):ink3).attr('font-weight',d=>d===state.month?700:400).text(d=>W<520?'T'+(+d.slice(5)):mShort(d));
  const hl=g.append('rect').attr('y',-4).attr('height',ih+8).attr('rx',8).attr('fill',cssv('--surface-2')).attr('opacity',0);
  const y0=y(0),dur=matchMedia('(prefers-reduced-motion:reduce)').matches?0:650;
  const bars=(key,col,dx)=>g.append('g').selectAll('path').data(data).join('path').attr('fill',col)
    .attr('d',d=>roundTop(x(d.m)+dx,y0,sub,0,4))
    .transition().duration(dur).delay((d,i)=>i*35).ease(d3.easeCubicOut).attr('d',d=>roundTop(x(d.m)+dx,y(d[key]),sub,y0-y(d[key]),4));
  bars('income',cIn,0); bars('expense',cOut,sub+2);
  const line=d3.line().x(d=>x(d.m)+x.bandwidth()/2).y(d=>y(d.net)).curve(d3.curveMonotoneX);
  const path=g.append('path').datum(data).attr('fill','none').attr('stroke',cNet).attr('stroke-width',2).attr('stroke-linejoin','round').attr('d',line);
  const len=path.node().getTotalLength(); if(dur)path.attr('stroke-dasharray',`${len} ${len}`).attr('stroke-dashoffset',len).transition().delay(450).duration(800).attr('stroke-dashoffset',0);
  const dots=g.append('g').selectAll('circle').data(data).join('circle').attr('cx',d=>x(d.m)+x.bandwidth()/2).attr('cy',d=>y(d.net)).attr('r',d=>d.m===state.month?4.5:3)
    .attr('fill',d=>d.m===state.month?cNet:surf).attr('stroke',cNet).attr('stroke-width',2);
  // direct label on current month's net
  const cur=data[data.length-1];
  g.append('text').attr('x',x(cur.m)-4).attr('y',y(cur.net)-12).attr('text-anchor','end').attr('font-size',11).attr('font-weight',700).attr('fill',cssv('--ink')).attr('paint-order','stroke').attr('stroke',surf).attr('stroke-width',4).attr('stroke-linejoin','round').text('Còn '+short(cur.net));
  // hover bands
  g.append('g').selectAll('rect').data(data).join('rect').attr('x',d=>x(d.m)-x.step()*x.paddingInner()/2).attr('width',x.step()).attr('y',-4).attr('height',ih+24).attr('fill','transparent').style('cursor','pointer')
    .on('pointermove',(ev,d)=>{hl.attr('x',x(d.m)-6).attr('width',x.bandwidth()+12).attr('opacity',1);dots.attr('r',o=>o===d?5.5:(o.m===state.month?4.5:3));
      tipShow(`<div class="th">${mLabel(d.m)}</div>${vizRow(cIn,'Thu',vnd(d.income))}${vizRow(cOut,'Chi',vnd(d.expense))}${vizRow(cNet,'Còn lại',vnd(d.net),1)}`,ev)})
    .on('pointerleave',()=>{hl.attr('opacity',0);dots.attr('r',o=>o.m===state.month?4.5:3);tipHide()})
    .on('click',(ev,d)=>{if(d.m!==state.month){tipHide();state.month=d.m;render()}});
  el.insertAdjacentHTML('beforeend',`<div class="sr"><table><caption>Thu chi 12 tháng</caption><tr><th>Tháng</th><th>Thu</th><th>Chi</th><th>Còn lại</th></tr>${data.map(d=>`<tr><td>${mShort(d.m)}</td><td>${vnd(d.income)}</td><td>${vnd(d.expense)}</td><td>${vnd(d.net)}</td></tr>`).join('')}</table></div>`);
}

/* Money: expense by category donut */
function drawDonut(el){
  if(!el)return; if(!D3OK())return vizNoD3(el);
  const S=monthSummary(state.month), keys=Object.keys(CATS), rows=keys.map(k=>({k,v:S.byCat[k]||0})), has=rows.some(r=>r.v>0);
  const size=el.clientWidth||170,R=size/2,ri=R*.7;
  el.querySelector('svg')?.remove();
  const svg=d3.select(el).insert('svg',':first-child').attr('width',size).attr('height',size).attr('viewBox',[-R,-R,size,size]).attr('role','img').attr('aria-label','Chi theo nhóm');
  const arc=d3.arc().innerRadius(ri).outerRadius(R-4).cornerRadius(3), arcH=d3.arc().innerRadius(ri).outerRadius(R).cornerRadius(3);
  const center=el.querySelector('.donut-c div');
  const setC=(v,l)=>{if(center)center.innerHTML=`<b class="num">${short(v)}</b><span>${l}</span>`};
  if(!has){svg.append('circle').attr('r',(R-4+ri)/2).attr('fill','none').attr('stroke',cssv('--line')).attr('stroke-width',R-4-ri);return}
  const pie=d3.pie().value(d=>d.v).sort(null).padAngle(.025);
  const dur=matchMedia('(prefers-reduced-motion:reduce)').matches?0:700;
  const segs=svg.selectAll('path').data(pie(rows.filter(r=>r.v>0))).join('path').attr('fill',d=>cssv(CATS[d.data.k].v)).style('cursor','pointer')
    .attr('stroke',cssv('--surface')).attr('stroke-width',2);
  segs.transition().duration(dur).ease(d3.easeCubicOut).attrTween('d',d=>{const i=d3.interpolate({startAngle:0,endAngle:0},d);return t=>arc(i(t))});
  const focus=k=>{segs.attr('d',d=>(d.data.k===k?arcH:arc)(d)).attr('opacity',d=>!k||d.data.k===k?1:.35);
    document.querySelectorAll('.catlist [data-cat]').forEach(r=>r.classList.toggle('dim',!!k&&r.dataset.cat!==k));
    if(k)setC(S.byCat[k]||0,`${CATS[k].name} · ${Math.round((S.byCat[k]||0)/S.expense*100)}%`);else setC(S.expense,'tổng chi')};
  segs.on('pointerenter',(e,d)=>focus(d.data.k)).on('pointerleave',()=>focus(null));
  document.querySelectorAll('.catlist [data-cat]').forEach(r=>{r.onpointerenter=()=>S.byCat[r.dataset.cat]&&focus(r.dataset.cat);r.onpointerleave=()=>focus(null)});
}

/* ---------- sheet / ask / toast ---------- */
let lastFocus=null;
function openSheet(title,html){lastFocus=document.activeElement;$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=html;$('#sheet').classList.add('on');$('#scrim').classList.add('on');document.body.classList.add('lock');setTimeout(()=>{const f=$('#sheetBody input:not([type=hidden]),#sheetBody select,#sheetBody button');if(f&&matchMedia('(min-width:960px)').matches)f.focus()},60)}
function closeSheet(){$('#sheet').classList.remove('on');$('#scrim').classList.remove('on');document.body.classList.remove('lock');tipHide();if(askResolve){askResolve(null);askResolve=null} /* đóng ngang = null: không chọn gì */lastFocus?.focus?.()}
let askResolve=null;
function ask(title,text,okLabel,cancelLabel){return new Promise(res=>{openSheet(title,`<p style="margin:0 0 8px;color:var(--ink-2)">${esc(text)}</p><div class="sheet-actions"><button class="btn" data-act="ask-no">${esc(cancelLabel)}</button><button class="btn primary" data-act="ask-yes">${esc(okLabel)}</button></div>`);askResolve=res})}
/* vuốt bảng xuống để đóng (điện thoại) */
(function sheetDrag(){
  const sh=$('#sheet'); let y0=0,t0=0,dy=0,on=false;
  const start=e=>{if(!matchMedia('(max-width:959px)').matches||e.target.closest('button,input,select,a'))return;
    if(!e.target.closest('.grab,.sheet-h'))return; on=true;y0=e.clientY;t0=performance.now();dy=0;sh.classList.add('drag');sh.setPointerCapture?.(e.pointerId)};
  const move=e=>{if(!on)return;dy=Math.max(0,e.clientY-y0);sh.style.transform=`translateY(${dy}px)`};
  const end=()=>{if(!on)return;on=false;sh.classList.remove('drag');const v=dy/Math.max(1,performance.now()-t0);
    requestAnimationFrame(()=>{sh.style.transform='';if(dy>110||v>.6)closeSheet()})};
  sh.addEventListener('pointerdown',start);sh.addEventListener('pointermove',move);
  sh.addEventListener('pointerup',end);sh.addEventListener('pointercancel',end);
})();
const buzz=()=>{try{navigator.vibrate?.(8)}catch{}};
function toast(msg,kind){const t=document.createElement('div');t.className='toast '+(kind||'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),kind==='bad'?5200:2600)}
function applyTheme(){const t=lsGet(LS.theme,'auto');if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t;
  $$('meta[name=theme-color]').forEach(m=>{const light=m.media.includes('light');m.content=t==='auto'?(light?'#EFF0EC':'#111118'):(t==='dark'?'#111118':'#EFF0EC')})}

/* ---------- actions ---------- */
const ACT={
  nav:el=>{closeSheet();go(el.dataset.tab)},
  'm-prev':()=>{state.month=addM(state.month,-1);render()},
  'm-next':()=>{state.month=addM(state.month,1);render()},
  apt:el=>aptSheet(el.dataset.apt),
  bill:el=>billSheet(el.dataset.apt),
  close:()=>closeSheet(),
  'ask-yes':()=>{const r=askResolve;askResolve=null;closeSheet();r&&r(true)},
  'ask-no':()=>{const r=askResolve;askResolve=null;closeSheet();r&&r(false)},
  paid:el=>{buzz();const id=el.dataset.apt,m=state.month,on=!read(m,id).paid;setRead(m,id,'paid',on?true:null);setRead(m,id,'paidDate',on?todayISO():null);commit();
    if(el.dataset.close){closeSheet()}
    if(state.tab==='util'){refreshUtilViz();const b=$(`[data-row="${id}"] .paidbtn`);b.classList.toggle('on',on);b.textContent=on?'✓ Đã thu':'Chưa thu';fillUtilRow(id)}else render();
    toast(on?`Căn ${id}: đã thu tiền điện nước`:`Căn ${id}: chuyển về chưa thu`)},
  lav:el=>{const id=el.dataset.apt,m=state.month,v=Math.max(0,(read(m,id).lavie||0)+ +el.dataset.d);setRead(m,id,'lavie',v||null);$(`[data-row="${id}"] [data-meter="lavie"]`).value=v||'';commit();fillUtilRow(id);refreshUtilViz()},
  'copy-bill':el=>copyText(billText(el.dataset.apt,state.month),'Đã copy — dán vào Zalo để gửi khách'),
  'share-bill':el=>navigator.share({text:billText(el.dataset.apt,state.month)}).catch(()=>{}),
  'copy-all':()=>{const ids=APTS.filter(id=>bill(id,state.month).entered);if(!ids.length){toast('Chưa có căn nào được nhập số');return}copyText(ids.map(id=>billText(id,state.month)).join('\n\n— — —\n\n'),`Đã copy thông báo của ${ids.length} căn`)},
  'add-rent':el=>rentSheet(el.dataset.apt),
  'del-rent':async el=>{const p=DB.rentPayments.find(x=>x.id===el.dataset.id);if(!p)return;const ok=await ask('Xóa thanh toán này?',`Căn ${p.apt} · ${vnd(p.amount)} · ngày ${dLabel(p.date)}`,'Xóa','Giữ lại');if(!ok)return;DB.rentPayments=DB.rentPayments.filter(x=>x!==p);commit();render();toast('Đã xóa thanh toán')},
  'add-tx':()=>txSheet(),
  'edit-tx':el=>txSheet(el.dataset.id),
  'del-tx':async el=>{const id=el.dataset.id;const ok=await ask('Xóa khoản này?','Khoản sẽ bị xóa khỏi sổ thu chi.','Xóa','Giữ lại');if(!ok)return;DB.transactions=DB.transactions.filter(t=>t.id!==id);commit();render();toast('Đã xóa khoản')},
  txf:el=>{state.txFilter=el.dataset.f;render()},
  recur:el=>{buzz();const r=DB.recurring.find(x=>x.id===el.dataset.id),m=state.month,t=recurTx(r,m);
    if(t)DB.transactions=DB.transactions.filter(x=>x!==t);
    else{DB.transactions.push({id:uid(),date:m===thisMonth()?todayISO():m+'-05',kind:'chi',cat:r.cat||'luong',who:r.who,note:r.role||'',amount:r.amount,recurId:r.id});if(!r.amount)toast(`“${r.who}” chưa có số tiền — điền trong Cài đặt → Chi cố định`,'bad')}
    commit();render()},
  'recur-all':()=>{const m=state.month;DB.recurring.forEach(r=>{if(!recurTx(r,m))DB.transactions.push({id:uid(),date:m===thisMonth()?todayISO():m+'-05',kind:'chi',cat:r.cat||'luong',who:r.who,note:r.role||'',amount:r.amount,recurId:r.id})});commit();render();toast('Đã đánh dấu tất cả khoản cố định')},
  'rec-add':()=>{DB.recurring.push({id:uid(),who:'Khoản mới',group:'Gia đình & khác',role:'',cat:'luong',amount:0});commit();render()},
  'rec-del':async el=>{const r=DB.recurring.find(x=>x.id===el.dataset.id);const ok=await ask(`Xóa “${r.who}” khỏi chi cố định?`,'Các khoản đã chi trong những tháng trước vẫn được giữ.','Xóa','Giữ lại');if(!ok)return;DB.recurring=DB.recurring.filter(x=>x!==r);commit();render()},
  'sync-now':()=>sync(true),
  pull:()=>pullRemote(false),
  'goto-gh':()=>{go('settings');setTimeout(()=>$('#gh')?.scrollIntoView({behavior:'smooth'}),50)},
  'gh-off':async()=>{const ok=await ask('Ngắt kết nối GitHub trên máy này?','Dữ liệu vẫn còn trên GitHub và trong máy. Token sẽ bị xóa khỏi trình duyệt này.','Ngắt kết nối','Thôi');if(!ok)return;lsDel(LS.gh);SYNC.state='local';render()},
  export:()=>{const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)},
  import:()=>$('#fileIn').click(),
  restore:async()=>{const bk=lsGet(LS.backup);if(!bk)return;const ok=await ask('Khôi phục bản dự phòng?',`Bản lưu lúc ${new Date(bk.at).toLocaleString('vi-VN')} sẽ thay cho dữ liệu hiện tại (bản hiện tại thành bản dự phòng mới).`,'Khôi phục','Thôi');if(!ok)return;lsSet(LS.backup,{at:Date.now(),data:DB});DB=normalize(bk.data);commit();render();toast('Đã khôi phục')},
  demo:()=>{DEMO=DB;DB=normalize(makeDemo());state.firstPaint=true;go('home')},
  'demo-exit':()=>{DB=DEMO;DEMO=null;state.firstPaint=true;render()},
  theme:el=>{lsSet(LS.theme,el.dataset.t);applyTheme();render()},
  'portal-new':async el=>{const id=el.dataset.apt,a=apt(id);
    if(a.portalPass){const ok=await ask(`Đổi mật khẩu căn ${id}?`,'Mật khẩu cũ sẽ hết tác dụng ngay khi trang khách được cập nhật. Bạn cần gửi mật khẩu mới cho khách.','Đổi mật khẩu','Thôi');if(!ok)return}
    if(el.dataset.close)closeSheet();portalNew(id);render();copyText(portalMsg(id),`Đã tạo mật khẩu căn ${id} và copy tin nhắn — dán vào Zalo gửi khách`)},
  'portal-copy':el=>copyText(portalMsg(el.dataset.apt),'Đã copy — dán vào Zalo gửi khách'),
  'portal-revoke':async el=>{const id=el.dataset.apt;const ok=await ask(`Thu hồi tài khoản căn ${id}?`,'Khách sẽ không xem được hóa đơn nữa (trang của căn này bị xóa khỏi web).','Thu hồi','Thôi');if(!ok)return;const a=apt(id);a.portalPass='';a.portalSalt='';commit();render();toast(`Đã thu hồi tài khoản căn ${id}`)},
  'portal-publish':()=>{if(!ghReady()){toast('Cần kết nối GitHub trước');return}publishVault(true)}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheet').classList.contains('on'))closeSheet()});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.meter){const id=t.dataset.apt,m=t.dataset.m,raw=t.value.replace(/[^\d]/g,'');if(t.value!==raw)t.value=raw;
    setRead(m,id,t.dataset.meter,raw===''?null:+raw);commit();fillUtilRow(id);refreshUtilViz();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.set){const k=t.dataset.set;let v=t.value;if(t.dataset.money){v=parseMoney(v);if(!isNum(v)){toast('Đơn giá chưa đúng','bad');return}t.value=fmt(v)}else if(k==='readingDay'){v=Math.min(28,Math.max(1,+v||20));t.value=v}else v=v.trim();DB.settings[k]=v;commit();renderSyncUI();toast('Đã lưu')}
  if(t.dataset.portal){DB.settings.portal[t.dataset.portal]=t.value.trim();commit();toast('Đã lưu')}
  if(t.dataset.rec){const r=DB.recurring.find(x=>x.id===t.dataset.rec);const k=t.dataset.k;if(k==='amount'){const v=parseMoney(t.value);r.amount=isNum(v)?v:0;t.value=r.amount?fmt(r.amount):''}else r[k]=t.value.trim();commit()}
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='fGh')return; e.preventDefault(); const f=e.target;
  const g={owner:f.owner.value.trim(),repo:f.repo.value.trim(),branch:f.branch.value.trim()||'main',path:f.path.value.trim()||'data.json',token:f.token.value.trim()};
  if(!ghReady(g)){toast('Cần nhập đủ tài khoản, repo và token','bad');return}
  if(DEMO){DB=DEMO;DEMO=null}
  lsSet(LS.gh,g); toast('Đang kết nối…');
  try{const {data,sha}=await ghGet(g);
    if(data){const ok=META.dirty&&DB.updatedAt?await ask('Trên GitHub đã có dữ liệu','Dùng dữ liệu trên GitHub cho máy này? (Bản trên máy sẽ được giữ làm bản dự phòng.)','Dùng bản GitHub','Ghi đè bằng bản trên máy'):true;
      if(ok===null){toast('Chưa kết nối — bạn chưa chọn bản dữ liệu nào');renderSyncUI();return}
      if(ok){lsSet(LS.backup,{at:Date.now(),data:DB});DB=normalize(data);META={sha,dirty:false,syncedAt:Date.now()};saveLocal();SYNC.state='ok';render();toast('Đã kết nối và tải dữ liệu')}
      else{META.sha=sha;META.dirty=true;await sync(true);render()}}
    else{META.sha=null;META.dirty=true;await sync(true);render();toast('Đã tạo data.json trên GitHub')}
  }catch(err){SYNC.state='err';SYNC.msg=err.message;render();toast('Không kết nối được: '+err.message,'bad')}
});
$('#fileIn').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const d=JSON.parse(await file.text());const ok=await ask('Nhập dữ liệu từ file?',`File “${file.name}” sẽ thay cho dữ liệu hiện tại. Bản hiện tại được giữ làm bản dự phòng.`,'Nhập','Thôi');if(!ok)return;if(DEMO){DB=DEMO;DEMO=null}lsSet(LS.backup,{at:Date.now(),data:DB});DB=normalize(d);commit();render();toast('Đã nhập dữ liệu')}catch{toast('File không đúng định dạng JSON','bad')}e.target.value=''});
window.addEventListener('hashchange',()=>{const t=location.hash.slice(1);if(TABS.some(x=>x[0]===t)&&t!==state.tab){state.tab=t;render()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&ghReady()&&!DEMO&&!META.dirty)pullRemote(true)});

/* ---------- boot ---------- */
(async function boot(){
  applyTheme();
  const local=lsGet(LS.data); META=Object.assign(META,lsGet(LS.meta,{}));
  DB=normalize(local||await fetchSiteData()||emptyDB());
  SYNC.state=ghReady()?(META.dirty?'dirty':'ok'):'local';
  state.month=defaultMonth(+DB.settings.readingDay||20);
  render();
  if(ghReady())pullRemote(true);
})();
</script>
</body>
</html>
